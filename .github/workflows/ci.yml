name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The tool drives Windows PowerShell, and test_guard.py's SystemRunner test
    # shells out to it for real. On Linux that subprocess is missing and the
    # suite fails for the wrong reason.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and dependencies
        run: pip install -e .

      - name: Run test suite
        run: python -m unittest discover -s tests -t . -v
