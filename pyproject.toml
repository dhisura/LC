[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-agent"
version = "0.1.0"
description = "LC (LazyCorp) - Ultra-lightweight local-first multi-agent software engineering & autonomous system company"
readme = "README.md"
authors = [{ name = "LC Team" }]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "httpx>=0.24.0",
    "ollama>=0.3.0"
]

[project.scripts]
lc = "lc.cli:main"

[tool.setuptools.packages.find]
include = ["lc*"]
